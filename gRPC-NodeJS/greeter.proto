syntax = "proto3";

package greeter;

service Greeter {
    rpc SayHello(HelloRequest) returns (HelloResponse);
    rpc GetNumbers(NumberRequest) returns (stream NumberRespose);
}

message HelloRequest {
    string name = 1;
}

message HelloResponse {
    string message = 1;
}

message NumberRequest {
    int32 number = 1;
}

message NumberRespose {
    int32 order = 1;
    int32 number = 2;
}